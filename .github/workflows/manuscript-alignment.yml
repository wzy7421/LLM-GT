name: Manuscript alignment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas==2.2.2 \
            PyYAML==6.0.2 \
            scikit-learn==1.5.1 \
            matplotlib==3.9.2

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Validate manuscript-aligned public constants
        run: python src/validate_manuscript_alignment.py

      - name: Smoke-test exact LLM prompt assembly without API access
        run: |
          python src/llm_interpretation.py \
            --cluster-id demo_A01 \
            --corpus academic \
            --terms term01 term02 term03 term04 term05 term06 term07 term08 term09 term10 \
            --records "synthetic representative record one" "synthetic representative record two" "synthetic representative record three" \
            > /tmp/llm_dry_run.txt
          grep -q 'DRY RUN: no API request was made.' /tmp/llm_dry_run.txt

      - name: Smoke-test repeated-output stability diagnostics
        run: |
          python src/stability.py \
            --input data/demo/llm_runs_demo.jsonl \
            --output /tmp/llm_stability_by_unit.csv \
            --summary-output /tmp/llm_stability_summary.csv
          test -s /tmp/llm_stability_by_unit.csv
          test -s /tmp/llm_stability_summary.csv

      - name: Smoke-test scaffold-to-claim and gap screen
        run: |
          python src/scaffold_to_claim_gate.py \
            --input data/demo/gate_demo.csv \
            --output /tmp/gate_decisions.csv
          test -s /tmp/gate_decisions.csv

      - name: Smoke-test manuscript-aligned Fig. 4 generation
        env:
          MPLBACKEND: Agg
        run: |
          python src/plot_figure4.py --output /tmp/figure4_role_aligned.png
          test -s /tmp/figure4_role_aligned.png
