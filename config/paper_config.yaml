manuscript:
  title: "Human-in-the-Loop Knowledge Organization for Interdisciplinary Synthesis: Semantic Mapping, LLM-Assisted Interpretation, and Grounded Theory"
  previous_reference: IPM-D-26-03845
  journal: "Information Processing & Management"

seed: 42

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  sensitivity_model: sentence-transformers/all-mpnet-base-v2
  normalize_embeddings: true
  output_dimension: 384

umap:
  n_neighbors: 15
  min_dist: 0.0
  n_components: 5
  metric: cosine
  random_state: 42

hdbscan:
  academic:
    min_cluster_size: 5
    min_samples: 5
    metric: euclidean
    cluster_selection_method: eom
  public:
    min_cluster_size: 30
    min_samples: 10
    metric: euclidean
    cluster_selection_method: eom

ctfidf:
  top_n_terms: 10
  stop_words: english

llm:
  model: gpt-4o-2024-11-20
  endpoint: v1/chat/completions
  primary_run_date: 2026-06-18
  client_sdk: openai==1.35.13
  temperature: 0.2
  top_p: 0.9
  seed: 42
  max_tokens: 600
  max_json_retries: 2
  paper_repeatability_runs: 10
  stochastic_sensitivity_seeds: [11, 23, 42, 67, 89, 101, 131, 167, 191, 223]

measured_environment:
  operating_system: Ubuntu 22.04 LTS
  cpu: AMD Ryzen 9 7950X
  system_ram_gb: 64
  gpu: NVIDIA GeForce RTX 4090
  vram_gb: 24
  python: 3.11.9
  cuda: 12.1
  pytorch: 2.3.1+cu121
  sentence_transformers: 3.0.1
  umap_learn: 0.5.6
  hdbscan: 0.8.38.post1
  scikit_learn: 1.5.1

evaluation:
  reference_theme_count: 32
  blind_subset_size: 103
  academic_record_count: 412
  external_record_count: 34500
  academic_clusters: 12
  academic_outliers: 33
  public_topic_families: 8
